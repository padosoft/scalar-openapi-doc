name: linter

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'task/**'

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this job verifies style/lint, it never commits fixes.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        # `npm ci` (strict) — fails on package.json/lockfile drift like the
        # deploy does. See LESSON [ci/cross-platform-lockfile].
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      # ESLint's import/order rule must resolve the @/routes and @/actions
      # modules that Wayfinder generates (they are gitignored).
      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      - name: Check PHP code style (Pint)
        run: composer lint:check

      - name: Check frontend formatting (Prettier)
        run: npm run format:check

      - name: Lint frontend (ESLint)
        run: npm run lint:check
